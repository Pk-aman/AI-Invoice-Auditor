[project]
name = "ai-auditor-services"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]   # FastAPI Depends()/Query() in defaults is the idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
