[project]
name = "agent-service"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S608", "B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
